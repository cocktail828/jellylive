<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">机顶盒配置：读取失败保留输入</title><desc id="desc">读取失败在IP输入下显示恢复说明，保留IP/端口与原有效配置，焦点定位IP；可修改后重新读取或取消。迟到的读取结果不覆盖离开的页面，不自动保存；从直播源或设置进入都返回各自入口。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="140" fill="#f6f5ff" font-size="46" font-weight="650">从机顶盒导入</text><text x="1824" y="132" fill="#c5b8ff" font-size="30" font-weight="500" text-anchor="end">JellyLive</text><text x="100" y="204" fill="#b9bfd0" font-size="28" font-weight="400">机顶盒配置</text><text x="100" y="292" fill="#f6f5ff" font-size="30" font-weight="600">机顶盒 IP</text><rect x="100" y="320" width="1080" height="96" rx="14" fill="#20263e" stroke="#fff" stroke-width="4"/><text x="128" y="382" fill="#f6f5ff" font-size="34" font-weight="400">192.0.2.10</text><text x="100" y="494" fill="#f6f5ff" font-size="30" font-weight="600">ADB 端口</text><rect x="100" y="522" width="1080" height="96" rx="14" fill="#20263e" stroke="#363e5d" stroke-width="1"/><text x="128" y="584" fill="#f6f5ff" font-size="34" font-weight="400">5555</text><text x="1280" y="292" fill="#f6f5ff" font-size="34" font-weight="650">读取前准备</text><text x="1280" y="365.0" fill="#b9bfd0" font-size="28" font-weight="400">与电视连接同一局域网。</text><text x="1280" y="408.4" fill="#b9bfd0" font-size="28" font-weight="400">机顶盒保持开机。</text><text x="1280" y="480.0" fill="#b9bfd0" font-size="28" font-weight="400">开启网络 ADB，并允许读取配置。</text><text x="1280" y="595.0" fill="#b9bfd0" font-size="28" font-weight="400">仅适配安徽移动百视通。</text><text x="1280" y="638.4" fill="#b9bfd0" font-size="28" font-weight="400">需要 root shell 读取权限。</text><rect x="100" y="790" width="500" height="88" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="350.0" y="846.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">读取配置</text><rect x="628" y="790" width="260" height="88" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="758.0" y="846.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">取消</text><text x="100" y="458" fill="#f2b4bb" font-size="28" font-weight="400">无法连接机顶盒，请检查 IP、端口和调试授权后重试。</text></g></svg>