<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">启动动画</title><desc id="desc">前置窗口仅同色深蓝背景，不绘制完整静态品牌PNG；系统图标层同底衔接应用动画。应用内图标每2秒旋转一圈，JellyLive固定；准备好立即进入主页，不等一圈完成。动态预览可分别查看前置背景、应用动画与就绪主页。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#101326" stroke="none" stroke-width="1"/><defs><linearGradient id="jellyfin-gradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#AA5CC3"/><stop offset="1" stop-color="#00A4DC"/></linearGradient></defs><svg x="620" y="398" width="180" height="180" viewBox="-16 -16 105 105"><g fill="url(#jellyfin-gradient)" fill-rule="evenodd"><path d="M0.98,65C-3.69,55.61 26.98,0 36.5,0c9.53,0 40.15,55.71 35.53,65s-66.37,9.39 -71.04,0m12.26,-8.15c3.07,6.15 43.52,6.08 46.55,0 3.03,-6.09 -17.03,-42.59 -23.27,-42.59S10.17,50.69 13.23,56.85z"/><path d="M24.71,49.16c-1.55,-3.12 8.63,-21.57 11.79,-21.57 3.17,0 13.32,18.49 11.79,21.57 -1.53,3.08 -22.02,3.12 -23.58,0z"/></g></svg><text x="844" y="522" fill="#f6f5ff" font-size="80" font-weight="650">JellyLive</text><text x="960" y="662" text-anchor="middle" fill="#a9adc6" font-size="28">正在准备直播…</text></g></svg>