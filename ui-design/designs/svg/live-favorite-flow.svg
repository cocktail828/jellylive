      <path d="M125 142 l12 -5 l11 5 M160 125 l9 -4 l9 4" fill="none" stroke="#dae1e7" stroke-width="2" opacity=".6" />
    </svg><rect x="685" y="952" width="550" height="64" rx="16" fill="#101629dd" stroke="none" stroke-width="1" /><text x="960" y="994" text-anchor="middle" fill="#dce0ef" font-size="26">已收藏 · 体育现场</text></g></svg><rect x="248" y="216" width="560" height="315" rx="12" fill="none" stroke="#414a65" stroke-width="2"/><text x="248" y="584" fill="#a9adc6" font-size="24" font-weight="400">底部提示放大</text><rect x="248" y="610" width="560" height="80" rx="16" fill="#1b2038" stroke="#414a65" stroke-width="1"/><text x="528" y="660" text-anchor="middle" fill="#dce0ef" font-size="26">已收藏 · 体育现场</text><text x="248" y="752" fill="#a9adc6" font-size="25" font-weight="400">长按确认：收藏当前播放频道</text><text x="248" y="798" fill="#a9adc6" font-size="25" font-weight="400">保存成功后提示约2秒</text><text x="1112" y="190" fill="#f6f5ff" font-size="32" font-weight="600">02  取消收藏</text><svg xmlns="http://www.w3.org/2000/svg" width="560" height="315" viewBox="0 0 1920 1080" role="img" aria-labelledby="panel1-title panel1-desc" x="1112" y="216">
<title id="panel1-title">直播全屏：取消收藏提示</title><desc id="panel1-desc">再次长按确认取消当前播放频道的收藏；保存成功后底部小字提示约2秒，列表同步更新，播放不中断。</desc>
<defs><linearGradient id="panel1-bg" x2="1" y2="1"><stop stop-color="#101326" /><stop offset="1" stop-color="#080c18" /></linearGradient>
<linearGradient id="panel1-purple" x2="1" y2="1"><stop stop-color="#6652d5" /><stop offset="1" stop-color="#3a327d" /></linearGradient></defs>
