<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>直播全屏长按收藏与取消收藏</title><rect width="1920" height="1080" fill="#101326"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="64" y="86" fill="#f6f5ff" font-size="46" font-weight="650">直播全屏 · 长按确认收藏</text><text x="64" y="134" fill="#a9adc6" font-size="26" font-weight="400">仅在长按操作后显示结果，不自动弹说明</text><text x="248" y="190" fill="#f6f5ff" font-size="32" font-weight="600">01  收藏成功</text><svg xmlns="http://www.w3.org/2000/svg" width="560" height="315" viewBox="0 0 1920 1080" role="img" aria-labelledby="panel0-title panel0-desc" x="248" y="216">
<title id="panel0-title">直播全屏：收藏结果提示</title><desc id="panel0-desc">长按只触发一次，松手不再触发短按；保存成功后底部小字提示约2秒，取消收藏显示已取消收藏。不中断播放、不弹确认对话框。</desc>
<defs><linearGradient id="panel0-bg" x2="1" y2="1"><stop stop-color="#101326" /><stop offset="1" stop-color="#080c18" /></linearGradient>
<linearGradient id="panel0-purple" x2="1" y2="1"><stop stop-color="#6652d5" /><stop offset="1" stop-color="#3a327d" /></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#panel0-bg)" /><svg x="0" y="0" width="1920" height="1080" viewBox="0 0 1100 620" preserveAspectRatio="xMidYMid slice">
