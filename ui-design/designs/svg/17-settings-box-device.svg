ght="600">设备型号</text><text x="1688" y="739" fill="#c5b8ff" font-size="28" font-weight="400" text-anchor="end">导入的设备型号</text><g transform="translate(1728 712) scale(0.7777777777777778)"><path d="M13 5 L26 18 L13 31" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="100" y="800" width="1688" height="112" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="128" y="869" fill="#f6f5ff" font-size="32" font-weight="600">设备版本描述</text><text x="1688" y="869" fill="#c5b8ff" font-size="28" font-weight="400" text-anchor="end">导入的版本信息</text><g transform="translate(1728 842) scale(0.7777777777777778)"><path d="M13 5 L26 18 L13 31" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>