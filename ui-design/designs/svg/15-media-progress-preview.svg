<title id="title">媒体播放器：精简进度预览</title><desc id="desc">隐藏时左右键直接显示精简底栏并预览10秒步进，长按30秒；仅进度条和其右下时间，没有标题、操作按钮或浮动时间。预览暂停，等待确认期间不自动隐藏。图示进度为设计示例。</desc>
