<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">状态：媒体库为空</title><desc id="desc">服务连接成功且完整目录确认零项时显示此页；默认刷新媒体库，强制跳过缓存；空分类和筛选无结果另行处理，不混登录/权限错误。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="107" fill="#f6f5ff" font-size="42" font-weight="650">我的媒体库</text><text x="1628" y="105" fill="#b9b0ef" font-size="32" font-weight="600">JellyLive</text><rect x="96" y="205" width="1728" height="695" rx="18" fill="#171c32" stroke="none" stroke-width="1"/><g data-role="library-state-message" data-center-x="960"><g transform="translate(912 368) scale(2.6666666666666665)"><path d="M5 5 H31 V31 H5 Z M5 12 H31 M12 5 V12 M24 5 V12 M14 17 L24 22 L14 27 Z" fill="none" stroke="#b4a0ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="960" y="542" text-anchor="middle" fill="#f6f5ff" font-size="46" font-weight="650">连接成功，还没有媒体内容。</text><text x="960" y="600" text-anchor="middle" fill="#a9adc6" font-size="28" font-weight="400">请在 Jellyfin 服务器添加媒体库，再回来刷新。</text><rect x="626.0" y="662" width="320" height="76" rx="14" fill="url(#purple)" stroke="#ffffff" stroke-width="4"/><g transform="translate(650.0 684.0) scale(0.8888888888888888)"><path d="M30 13 A13 13 0 1 0 30 24 M30 4 V14 H20" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="696.0" y="710.0" fill="#f6f5ff" font-size="28" font-weight="600">刷新媒体库</text><rect x="974.0" y="662" width="320" height="76" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><g transform="translate(998.0 684.0) scale(0.8888888888888888)"><path d="M10 5 L29 18 L10 31 Z" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1044.0" y="710.0" fill="#f6f5ff" font-size="28" font-weight="600">返回看直播</text></g></g></svg>