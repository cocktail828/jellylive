<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">机顶盒配置：读取成功待保存</title><desc id="desc">设备/文件读取成功后只进入待保存草稿，不直接覆写。可测试登录或检查并保存；示例字段均为虚构。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="140" fill="#f6f5ff" font-size="46" font-weight="650">机顶盒配置</text><text x="1824" y="132" fill="#c5b8ff" font-size="30" font-weight="500" text-anchor="end">JellyLive</text><text x="100" y="212" fill="#c5b8ff" font-size="32" font-weight="400">读取成功，尚未保存</text><text x="100" y="304" fill="#f6f5ff" font-size="30" font-weight="600">平台编号（UserID）</text><rect x="100" y="336" width="1080" height="96" rx="14" fill="#20263e" stroke="#363e5d" stroke-width="1"/><text x="128" y="398" fill="#f6f5ff" font-size="34" font-weight="400">示例平台编号</text><text x="100" y="524" fill="#f6f5ff" font-size="30" font-weight="600">原机顶盒 MAC</text><rect x="100" y="556" width="1080" height="96" rx="14" fill="#20263e" stroke="#363e5d" stroke-width="1"/><text x="128" y="618" fill="#f6f5ff" font-size="34" font-weight="400">00:11:22:33:44:55</text><text x="1280" y="304" fill="#f6f5ff" font-size="34" font-weight="650">其他参数</text><text x="1280" y="370.0" fill="#b9bfd0" font-size="28" font-weight="400">设备、服务与认证参数按类别查看。</text><rect x="1280" y="532" width="520" height="88" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="1540.0" y="588.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">高级参数</text><text x="1280" y="702.0" fill="#b9bfd0" font-size="28" font-weight="400">修改暂存为草稿，保存后才会生效。</text><rect x="100" y="836" width="500" height="88" rx="14" fill="url(#purple)" stroke="#fff" stroke-width="4"/><text x="350.0" y="892.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">测试登录与频道</text><rect x="628" y="836" width="500" height="88" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="878.0" y="892.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">保存配置</text></g></svg>