<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">设置：播放页签</title><desc id="desc">播放设置仅保留启动时自动播放直播、剧集自动播放下集。两项均为单行名称与右侧开关，确认一键切换；画面比例、音轨、字幕在各自播放器调整。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="140" fill="#f6f5ff" font-size="46" font-weight="650">设置</text><text x="1824" y="132" fill="#c5b8ff" font-size="30" font-weight="500" text-anchor="end">JellyLive</text><rect x="100" y="226" width="348" height="84" rx="14" fill="url(#purple)" stroke="#fff" stroke-width="4"/><text x="124" y="280" fill="#f6f5ff" font-size="30" font-weight="650">播放设置</text><rect x="100" y="338" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="392" fill="#f6f5ff" font-size="30" font-weight="500">显示与操作</text><rect x="100" y="450" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="504" fill="#f6f5ff" font-size="30" font-weight="500">媒体库连接</text><rect x="100" y="562" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="616" fill="#f6f5ff" font-size="30" font-weight="500">机顶盒配置</text><rect x="100" y="674" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="728" fill="#f6f5ff" font-size="30" font-weight="500">关于</text><text x="544" y="272" fill="#f6f5ff" font-size="36" font-weight="650">播放设置</text><g data-role="settings-row" data-title="启动时自动播放直播" data-kind="toggle" data-disabled="false"><rect x="548" y="320" width="1240" height="96" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="380.0" fill="#f6f5ff" font-size="32" font-weight="600">启动时自动播放直播</text><text x="1650" y="380.0" fill="#c5b8ff" font-size="28" font-weight="400" text-anchor="end">开启</text><rect x="1684" y="347.0" width="80" height="42" rx="21" fill="#7561ed" stroke="none" stroke-width="1"/><circle cx="1742" cy="368.0" r="15" fill="#f6f5ff"/></g><g data-role="settings-row" data-title="剧集自动播放下集" data-kind="toggle" data-disabled="false"><rect x="548" y="432" width="1240" height="96" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="492.0" fill="#f6f5ff" font-size="32" font-weight="600">剧集自动播放下集</text><text x="1650" y="492.0" fill="#c5b8ff" font-size="28" font-weight="400" text-anchor="end">开启</text><rect x="1684" y="459.0" width="80" height="42" rx="21" fill="#7561ed" stroke="none" stroke-width="1"/><circle cx="1742" cy="480.0" r="15" fill="#f6f5ff"/></g></g></svg>