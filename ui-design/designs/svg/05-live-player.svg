<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">直播全屏与信息条</title><desc id="desc">与媒体共用144px高两行信息栏：上行全宽节目进度，下行频道名和三个低调状态按钮，当前示例为原始、普通话、字幕。按钮仅显示生效选项；关闭、默认或不可用时显示功能名。普通直播不虚构时移，频道浏览使用图10侧栏。信息栏及对应浮层使用35%透明背景，文字与焦点保持实色。 基础面板35%透明，第二行增加连续低调文字保护，保证亮视频下可读。失败、缓冲、未知时长分别见图51/57/61。</desc>
