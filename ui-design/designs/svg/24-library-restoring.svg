<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">媒体库：居中恢复连接</title><desc id="desc">点击媒体库后显示，图标、当前库名、正在恢复连接与短说明在页面中央成组展示；标题保持左对齐。仅真实连接等待，不伪造百分比，无全屏卡片、无页脚。重试时复用同一布局，标题为正在重新连接；无配置则直接图27。返回取消本次等待，迟到结果不能打开媒体库。</desc>
