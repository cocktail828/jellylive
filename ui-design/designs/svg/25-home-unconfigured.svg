<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">主页：未配置直播源</title><desc id="desc">图105独立展示首次启动且无直播源的完整主页，不叠盖旧频道列表。左侧未配置原因与两个恢复动作居中；右侧频道分组和无频道状态清晰分开；底部收藏/纪录片/媒体库/设置保留，纪录片暂无功能。机顶盒配置可导入/手动填写，检查直播源可添加其他来源，配置后回主页继续获取频道。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><rect x="100" y="64" width="1052" height="716" rx="20" fill="#101629" stroke="#414866" stroke-width="1"/><rect x="1184" y="64" width="640" height="716" rx="16" fill="#14192e" stroke="#363e5d" stroke-width="1"/><rect x="1192" y="80" width="616" height="62" rx="14" fill="#242a46" stroke="#454d68" stroke-width="1"/><g transform="translate(1214 97) scale(0.7777777777777778)"><path d="M18 3 L33 18 L18 33 L3 18 Z M18 10 L26 18 L18 26 L10 18 Z" fill="none" stroke="#c4b7ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1260" y="122" fill="#f6f5ff" font-size="28" font-weight="600">全部频道</text><g transform="translate(1758 98) scale(0.7777777777777778)"><path d="M6 12 L18 24 L30 12" fill="none" stroke="#a9adc6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1504" y="452" text-anchor="middle" fill="#f6f5ff" font-size="32" font-weight="600">暂无频道</text><text x="1504" y="496" text-anchor="middle" fill="#a9adc6" font-size="26" font-weight="400">配置直播源后显示频道</text><g data-role="channel-error-message" data-center-x="626"><g transform="translate(586 232) scale(2.2222222222222223)"><path d="M18 3 L34 31 H2 Z M18 12 V21 M18 25 V27" fill="none" stroke="#bba8ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="626" y="390" text-anchor="middle" fill="#f6f5ff" font-size="42" font-weight="650">未配置直播源</text><text x="626" y="452" text-anchor="middle" fill="#a9adc6" font-size="26" font-weight="400">完成机顶盒配置，或添加其他直播源。</text><rect x="296" y="510" width="320" height="84" rx="14" fill="url(#purple)" stroke="#ffffff" stroke-width="4"/><text x="456.0" y="562.0" text-anchor="middle" fill="#f6f5ff" font-size="28" font-weight="600">机顶盒配置</text><rect x="646" y="510" width="310" height="84" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="801.0" y="562.0" text-anchor="middle" fill="#f6f5ff" font-size="28" font-weight="600">检查直播源</text></g><rect x="100" y="826" width="406" height="176" rx="18" fill="#242a46" stroke="#363e5d" stroke-width="1"/><g transform="translate(235.0 892) scale(1.2222222222222223)"><path d="M18 3 L23 13 L34 14 L26 22 L28 33 L18 28 L8 33 L10 22 L2 14 L13 13 Z" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="299.0" y="928" fill="#f6f5ff" font-size="36" font-weight="600">收藏</text><rect x="538" y="826" width="406" height="176" rx="18" fill="#242a46" stroke="#363e5d" stroke-width="1"/><g transform="translate(655.0 892) scale(1.2222222222222223)"><path d="M18 3 L33 18 L18 33 L3 18 Z M18 10 L26 18 L18 26 L10 18 Z" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="719.0" y="928" fill="#f6f5ff" font-size="36" font-weight="600">央视频</text><rect x="976" y="826" width="406" height="176" rx="18" fill="#242a46" stroke="#363e5d" stroke-width="1"/><g transform="translate(1093.0 892) scale(1.2222222222222223)"><path d="M5 5 H31 V31 H5 Z M5 12 H31 M12 5 V12 M24 5 V12 M14 17 L24 22 L14 27 Z" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1157.0" y="928" fill="#f6f5ff" font-size="36" font-weight="600">媒体库</text><rect x="1414" y="826" width="406" height="176" rx="18" fill="#242a46" stroke="#363e5d" stroke-width="1"/><g transform="translate(1549.0 892) scale(1.2222222222222223)"><path d="M18 3 L23 5 L25 10 L31 12 L33 18 L30 24 L25 26 L23 31 L17 33 L11 30 L9 25 L4 23 L3 17 L6 11 L11 9 L13 4 Z M24 18 A6 6 0 1 1 12 18 A6 6 0 1 1 24 18" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1613.0" y="928" fill="#f6f5ff" font-size="36" font-weight="600">设置</text></g></svg>