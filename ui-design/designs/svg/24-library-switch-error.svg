<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">媒体库：切换失败保留原库</title><desc id="desc">切换失败保留旧当前标记与失败目标焦点，目标显示未连接，错误说明居中且保留原库名。确认可重试目标，上下可选其他库；不丢失旧账号/会话，不强制重新填写。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="107" fill="#f6f5ff" font-size="42" font-weight="650">切换媒体库</text><text x="1628" y="105" fill="#b9b0ef" font-size="32" font-weight="600">JellyLive</text><text x="960" y="240" text-anchor="middle" fill="#b9bfd0" font-size="30" font-weight="400">当前：客厅媒体库</text><rect x="400" y="320" width="1120" height="100" rx="14" fill="#1b2038" stroke="#363e5d" stroke-width="1"/><text x="432" y="383" text-anchor="start" fill="#f6f5ff" font-size="32" font-weight="600">客厅媒体库 · 示例账号</text><text x="1436" y="383" text-anchor="end" fill="#c5b8ff" font-size="28" font-weight="400">当前</text><g transform="translate(1456 354) scale(0.8888888888888888)"><path d="M5 18 L14 27 L31 8" fill="none" stroke="#c5b8ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="400" y="440" width="1120" height="100" rx="14" fill="url(#purple)" stroke="#fff" stroke-width="4"/><text x="432" y="503" text-anchor="start" fill="#f6f5ff" font-size="32" font-weight="600">家庭影音 · 访客账号</text><text x="1488" y="503" text-anchor="end" fill="#f6f5ff" font-size="28" font-weight="400">未连接</text><rect x="400" y="560" width="1120" height="100" rx="14" fill="#1b2038" stroke="#363e5d" stroke-width="1"/><text x="432" y="623" text-anchor="start" fill="#f6f5ff" font-size="32" font-weight="600">书房媒体库 · 示例账号</text><text x="960" y="756" text-anchor="middle" fill="#f2b4bb" font-size="28" font-weight="400">家庭影音连接失败，请重试或选择其他媒体库。</text><text x="960" y="806" text-anchor="middle" fill="#b9bfd0" font-size="28" font-weight="400">当前媒体库仍为客厅媒体库</text></g></svg>