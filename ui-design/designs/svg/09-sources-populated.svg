roke="#363e5d" stroke-width="1"/><text x="1230.0" y="780.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">刷新</text><rect x="1316" y="724.0" width="140" height="88" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="1386.0" y="780.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">编辑</text><rect x="1472" y="724.0" width="140" height="88" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="1542.0" y="780.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">停用</text><rect x="1628" y="724.0" width="140" height="88" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="1698.0" y="780.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">删除</text></g></svg>