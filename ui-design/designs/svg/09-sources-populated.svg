<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">设置：直播源列表</title><desc id="desc">设置两栏结构，左侧直播源类别选中，右侧直接显示统一来源列表与添加直播源，不再出现管理直播源中间入口。电视直播源置顶，同行直接刷新频道/机顶盒配置；其他来源按名称显示类型/频道数/状态，并直接提供刷新/编辑/启停/删除，不再套管理菜单。未配置时电视源刷新禁用并跳过焦点，配置可用。独立机顶盒配置类别保留。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="140" fill="#f6f5ff" font-size="46" font-weight="650">设置</text><text x="1824" y="132" fill="#c5b8ff" font-size="30" font-weight="500" text-anchor="end">JellyLive</text><rect x="100" y="226" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="280" fill="#f6f5ff" font-size="30" font-weight="500">播放设置</text><rect x="100" y="338" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="392" fill="#f6f5ff" font-size="30" font-weight="500">显示与操作</text><rect x="100" y="450" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="504" fill="#f6f5ff" font-size="30" font-weight="500">媒体库连接</text><rect x="100" y="562" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="616" fill="#f6f5ff" font-size="30" font-weight="500">机顶盒配置</text><rect x="100" y="674" width="348" height="84" rx="14" fill="#36305c" stroke="#363e5d" stroke-width="1"/><text x="124" y="728" fill="#c5b8ff" font-size="30" font-weight="650">直播源</text><rect x="100" y="786" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="840" fill="#f6f5ff" font-size="30" font-weight="500">关于</text><text x="544" y="272" fill="#f6f5ff" font-size="36" font-weight="650">直播源</text><text x="760" y="272" fill="#b9bfd0" font-size="26" font-weight="400">3 个直播源</text><rect x="1492" y="226" width="296" height="76" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="1640.0" y="276.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">添加直播源</text><rect x="548" y="328" width="1240" height="160" rx="14" fill="#171d32" stroke="#343d56" stroke-width="1"/><text x="580" y="382" fill="#f6f5ff" font-size="32" font-weight="600">电视直播源</text><text x="580" y="436" fill="#b