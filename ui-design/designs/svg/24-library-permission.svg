<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">媒体库：暂无访问权限</title><desc id="desc">当前账号无权限独立提示，保留其他来源；不反复重连同一账号，不把权限问题说成空库。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="107" fill="#f6f5ff" font-size="42" font-weight="650">我的媒体库</text><text x="1628" y="105" fill="#b9b0ef" font-size="32" font-weight="600">JellyLive</text><rect x="96" y="205" width="1728" height="695" rx="18" fill="#171c32" stroke="none" stroke-width="1"/><g transform="translate(912 350) scale(2.6666666666666665)"><path d="M18 3 L34 31 H2 Z M18 12 V21 M18 25 V27" fill="none" stroke="#b4a0ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="960" y="534" text-anchor="middle" fill="#f6f5ff" font-size="46" font-weight="650">当前账号没有访问权限</text><text x="960" y="596" text-anchor="middle" fill="#a9adc6" font-size="28" font-weight="400">请联系服务器管理员，或切换有权限的账号。</text><rect x="626.0" y="708" width="320" height="76" rx="14" fill="url(#purple)" stroke="#ffffff" stroke-width="4"/><text x="786.0" y="756.0" text-anchor="middle" fill="#f6f5ff" font-size="28" font-weight="600">切换账号</text><rect x="974.0" y="708" width="320" height="76" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="1134.0" y="756.0" text-anchor="middle" fill="#f6f5ff" font-size="28" font-weight="600">返回媒体库</text></g></svg>