<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" role="img" aria-labelledby="title desc">
<title id="title">媒体库首页 · 4K 遥控器设计</title>
<desc id="desc">左上当前媒体库名称，左侧全部媒体、电影、电视剧、观看记录、收藏。顶部搜索和四项筛选，内容区右上排序，五列占位海报。首张卡片白框为遥控焦点。媒体信息均为示例。</desc>
<defs>
<linearGradient id="background" x2="1" y2="1"><stop stop-color="#1b1c29"/><stop offset=".5" stop-color="#10131c"/><stop offset="1" stop-color="#0c1017"/></linearGradient>
<linearGradient id="sidebar" x2="1" y2="0"><stop stop-color="#171924"/><stop offset="1" stop-color="#171924" stop-opacity=".2"/></linearGradient>
<linearGradient id="selection"><stop stop-color="#373047"/><stop offset="1" stop-color="#302c40"/></linearGradient>
<linearGradient id="bottom-fade" x2="0" y2="1"><stop stop-color="#0d1119" stop-opacity="0"/><stop offset="1" stop-color="#0d1119"/></linearGradient>
<filter id="card-shadow" x="-15%" y="-10%" width="130%" height="130%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="22"/><feOffset dx="0" dy="20"/><feComponentTransfer><feFuncA type="linear" slope=".24"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="grid-viewport"><rect x="774" y="526" width="2964" height="1506"/></clipPath>
</defs>
<rect width="3840" height="2160" fill="url(#background)"/>
<rect width="704" height="2160" fill="url(#sidebar)"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="128" y="226" font-size="64" fill="#f3f1f8" font-weight="600" text-anchor="start">客厅媒体库</text><g data-role="sidebar-entry" data-focused="false"><g transform="translate(168 424) scale(1.3333333333333333)"><path d="M4 4h11v11H4zM22 4h11v11H22zM4 22h11v11H4zM22 22h11v11H22z" fill="none" stroke="#b5b3c5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="252" y="470" font-size="56" fill="#b5b3c5" font-weight="400" text-anchor="start">全部媒体</text></g><g data-role="sidebar-entry" data-focused="false"><rect x="128" y="560" width="512" height="144" rx="28" fill="url(#selection)" stroke="none" stroke-width="2"/><g transform="translate(168 608) scale(1.3333333333333333)"><path d="M4 7h28v25H4zM4 15h28M13 7l5 8M24 7l5 8" fill="none" stroke="#e3daef" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="252" y="654" font-size="56" fill="#f3f1f8" font-weight="600" text-anchor="start">电影</text></g><g data-role="sidebar-entry" data-focused="false"><g transform="translate(168 792) scale(1.3333333333333333)"><path d="M4 7h28v21H4zM12 33h12M18 28v5" fill="none" stroke="#b5b3c5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="252" y="838" font-size="56" fill="#b5b3c5" font-weight="400" text-anchor="start">电视剧</text></g><g data-role="sidebar-entry" data-focused="false"><g transform="translate(168 976) scale(1.3333333333333333)"><path d="M6 11a14 14 0 1 1-1 14M5 3v10h10M18 9v10l7 4" fill="none" stroke="#b5b3c5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="252" y="1022" font-size="56" fill="#b5b3c5" font-weight="400" text-anchor="start">观看记录</text></g><g data-role="sidebar-entry" data-focused="false"><g transform="translate(168 1160) scale(1.3333333333333333)"><path d="M18 3l4.6 9.6L33 14l-7.5 7.3L27.3 32L18 27l-9.3 5l1.8-10.7L3 14l10.4-1.4z" fill="none" stroke="#b5b3c5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="252" y="1206" font-size="56" fill="#b5b3c5" font-weight="400" text-anchor="start">收藏</text></g><g data-role="control" data-focused="false" data-disabled="false" data-label="搜索电影" opacity="1"><rect x="800" y="128" width="904" height="144" rx="28" fill="#242631" stroke="none" stroke-width="2"/><g transform="translate(832 178.0) scale(1.2222222222222223)"><path d="M27 15a12 12 0 1 1-24 0a12 12 0 1 1 24 0M24 24l10 10" fill="none" stroke="#b5b3c5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="900" y="217.68" font-size="52" fill="#dfdce8" font-weight="500" text-anchor="start">搜索电影</text></g><g data-role="control" data-focused="false" data-disabled="false" data-label="类型：全部" opacity="1"><rect x="1736" y="128" width="470" height="144" rx="28" fill="#242631" stroke="none" stroke-width="2"/><text x="1768" y="216.32" font-size="48" fill="#dfdce8" font-weight="500" text-anchor="start">类型：全部</text></g><g transform="translate(2126 184) scale(1.1111111111111112)"><path d="M8 14l10 10l10-10" fill="none" stroke="#b5b3c5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><g data-role="control" data-focused="false" data-disabled="false" data-label="年份：全部" opacity="1"><rect x="2238" y="128" width="470" height="144" rx="28" fill="#242631" stroke="none" stroke-width="2"/><text x="2270" y="216.32" font-size="48" fill="#dfdce8" font-weight="500" text-anchor="start">年份：全部</text></g><g transform="translate(2628 184) scale(1.1111111111111112)"><path d="M8 14l10 10l10-10" fill="none" stroke="#b5b3c5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><g data-role="control" data-focused="false" data-disabled="false" data-label="评分：不限" opacity="1"><rect x="2740" y="128" width="470" height="144" rx="28" fill="#242631" stroke="none" stroke-width="2"/><text x="2772" y="216.32" font-size="48" fill="#dfdce8" font-weight="500" text-anchor="start">评分：不限</text></g><g transform="translate(3130 184) scale(1.1111111111111112)"><path d="M8 14l10 10l10-10" fill="none" stroke="#b5b3c5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><g data-role="control" data-focused="false" data-disabled="false" data-label="进度：全部" opacity="1"><rect x="3242" y="128" width="470" height="144" rx="28" fill="#242631" stroke="none" stroke-width="2"/><text x="3274" y="216.32" font-size="48" fill="#dfdce8" font-weight="500" text-anchor="start">进度：全部</text></g><g transform="translate(3632 184) scale(1.1111111111111112)"><path d="M8 14l10 10l10-10" fill="none" stroke="#b5b3c5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="800" y="452" font-size="80" fill="#f3f1f8" font-weight="650" text-anchor="start">电影详情</text><text x="800" y="646" font-size="80" fill="#f3f1f8" font-weight="650" text-anchor="start">山河之间：归途、旧日来信与未竟的远方</text><text x="800" y="778" font-size="56" fill="#f3f1f8" font-weight="600" text-anchor="start">剧情简介</text><rect x="800" y="838" width="2912" height="1110" rx="28" fill="#171924" stroke="#f6f4ff" stroke-width="8"/><text x="864" y="964" font-size="56" fill="#b5b3c5" font-weight="400" text-anchor="start">一封迟到多年的来信，让离乡已久的林野重新踏上归途。</text><text x="864" y="1096" font-size="56" fill="#b5b3c5" font-weight="400" text-anchor="start">穿过山川与旧城，他在沿途遇见曾经的伙伴，也逐渐了解家人未曾说出的往事。</text><text x="864" y="1228" font-size="56" fill="#b5b3c5" font-weight="400" text-anchor="start">故事从一次普通的返乡开始，在不同时代的记忆之间展开。</text><text x="864" y="1360" font-size="56" fill="#b5b3c5" font-weight="400" text-anchor="start">每一段相遇都改变着他对故乡的认识，也让他重新思考那些没有完成的约定。</text><text x="864" y="1492" font-size="56" fill="#b5b3c5" font-weight="400" text-anchor="start">当熟悉的街巷和陌生的生活交错，他需要决定如何面对过去，又如何继续前行。</text><text x="864" y="1624" font-size="56" fill="#b5b3c5" font-weight="400" text-anchor="start">这段旅程既属于一个家庭，也映照着普通人在岁月中的选择。</text><text x="864" y="1756" font-size="56" fill="#b5b3c5" font-weight="400" text-anchor="start">当山海再次出现在眼前，故乡的意义也在一次次告别与重逢中变得清晰。</text></g></svg>