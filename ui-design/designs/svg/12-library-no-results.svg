<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">媒体筛选：无结果与清除</title><desc id="desc">筛选零结果与真空库不同；默认焦点在清除筛选，工具栏下键可到此按钮；清除即更新且不需应用。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="107" fill="#f6f5ff" font-size="42" font-weight="650">电影</text><text x="1628" y="105" fill="#b9b0ef" font-size="32" font-weight="600">JellyLive</text><text x="96" y="155" fill="#a9adc6" font-size="24" font-weight="400">电影 · 0 部</text><g data-role="library-toolbar"><rect x="888" y="136" width="296" height="76" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><g transform="translate(912 158.0) scale(0.8888888888888888)"><path d="M25 15 A10 10 0 1 1 5 15 A10 10 0 1 1 25 15 M23 23 L33 33" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="958" y="184.0" fill="#f6f5ff" font-size="28" font-weight="600">搜索媒体</text><rect x="1208" y="136" width="296" height="76" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="1234" y="184.0" fill="#f6f5ff" font-size="28" font-weight="600">类型：剧情</text><rect x="1528" y="136" width="296" height="76" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="1554" y="184.0" fill="#f6f5ff" font-size="28" font-weight="600">排序：名称</text></g><g transform="translate(912 350) scale(2.6666666666666665)"><path d="M25 15 A10 10 0 1 1 5 15 A10 10 0 1 1 25 15 M23 23 L33 33" fill="none" stroke="#b4a0ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="960" y="536" text-anchor="middle" fill="#f6f5ff" font-size="44" font-weight="650">没有符合条件的媒体</text><text x="960" y="596" text-anchor="middle" fill="#a9adc6" font-size="28" font-weight="400">调整筛选条件，或清除筛选查看全部电影。</text><rect x="700" y="660" width="520" height="84" rx="14" fill="url(#purple)" stroke="#ffffff" stroke-width="4"/><text x="960.0" y="712.0" text-anchor="middle" fill="#f6f5ff" font-size="28" font-weight="600">清除筛选</text></g></svg>