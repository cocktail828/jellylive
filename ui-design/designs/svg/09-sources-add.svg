und" stroke-linejoin="round"/></g><text x="1260" y="342.0" fill="#f6f5ff" font-size="28" font-weight="600">刷新频道</text><rect x="1460" y="294" width="320" height="76" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><g transform="translate(1484 316.0) scale(0.8888888888888888)"><path d="M18 3 L23 5 L25 10 L31 12 L33 18 L30 24 L25 26 L23 31 L17 33 L11 30 L9 25 L4 23 L3 17 L6 11 L11 9 L13 4 Z M24 18 A6 6 0 1 1 12 18 A6 6 0 1 1 24 18" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1530" y="342.0" fill="#f6f5ff" font-size="28" font-weight="600">机顶盒配置</text><rect x="1230" y="220" width="600" height="206" rx="18" fill="#070b16" stroke="none" stroke-width="1"/><rect x="1224" y="208" width="600" height="206" rx="18" fill="#1b2238" stroke="#606b86" stroke-width="1"/><rect x="1238" y="222" width="572" height="82" rx="12" fill="url(#purple)" stroke="#fff" stroke-width="4"/><g transform="translate(1256 246) scale(0.8888888888888888)"><path d="M15 10 L19 6 A8 8 0 0 1 30 17 L25 22 M11 14 L6 19 A8 8 0 0 0 17 30 L22 25 M12 24 L24 12" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1310" y="256" fill="#f6f5ff" font-size="28" font-weight="600">M3U 直播源</text><text x="1310" y="288" fill="#dbd4ed" font-size="24" font-weight="400">添加播放列表与可选节目单</text><rect x="1238" y="312" width="572" height="82" rx="12" fill="none" stroke="none" stroke-width="1"/><g transform="translate(1256 336) scale(0.8888888888888888)"><path d="M4 7 H32 V27 H4 Z M12 32 H24 M18 27 V32" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1310" y="346" fill="#f6f5ff" font-size="28" font-weight="600">Jellyfin 服务器</text><text x="1310" y="378" fill="#a9adc6" font-size="24" font-weight="400">读取服务端已配置的直播频道</text></g></svg>