<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">直播源：统一添加入口</title><desc id="desc">添加直播源就近展开M3U与Jellyfin两种类型；Jellyfin连接后读取真实直播频道，没有配置或无权限时明确反馈，不生成假来源。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="107" fill="#f6f5ff" font-size="42" font-weight="650">直播源</text><text x="1628" y="105" fill="#b9b0ef" font-size="32" font-weight="600">JellyLive</text><text x="96" y="155" fill="#a9adc6" font-size="24" font-weight="400">管理频道来源，已启用的频道会显示在分组列表中</text><rect x="1464" y="130" width="356" height="64" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><g transform="translate(1524 146.0) scale(0.8888888888888888)"><path d="M18 5 V31 M5 18 H31" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1570" y="172.0" fill="#f6f5ff" font-size="28" font-weight="600">添加直播源</text><rect x="1464" y="130" width="356" height="64" rx="14" fill="#39315e" stroke="#a996e5" stroke-width="1"/><g transform="translate(1492 146) scale(0.8888888888888888)"><path d="M18 5 V31 M5 18 H31" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1538" y="172" fill="#f6f5ff" font-size="28" font-weight="600">添加直播源</text><text x="96" y="242" fill="#f6f5ff" font-size="30" font-weight="600">电视直播源</text><rect x="96" y="268" width="1728" height="180" rx="18" fill="#171d32" stroke="#343d56" stroke-width="1"/><rect x="96" y="316" width="72" height="72" rx="16" fill="#2b2848" stroke="none" stroke-width="1"/><g transform="translate(114 332) scale(1.0)"><path d="M4 7 H32 V27 H4 Z M12 32 H24 M18 27 V32" fill="none" stroke="#c7b8ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="196" y="334" fill="#f6f5ff" font-size="34" font-weight="600">内置直播源</text><text x="196" y="390" fill="#a9adc6" font-size="26" font-weight="400">145 个频道 · 今天 20:50 更新</text><rect x="1036" y="334" width="134" height="40" rx="20" fill="#2b2850" stroke="none" stroke-width="1"/><text x="1054" y="362" fill="#a5dbbf" font-size="24" font-weight="400">已就绪</text><rect x="1230" y="320" width="244" height="76" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><g transform="translate(1254 342.0) scale(0.8888888888888888)"><path d="M30 13 A13 13 0 1 0 30 24 M30 4 V14 H20" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1300" y="368.0" fill="#f6f5ff" font-size="28" font-weight="600">刷新频道</text><rect x="1500" y="320" width="320" height="76" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><g transform="translate(1524 342.0) scale(0.8888888888888888)"><path d="M18 3 L23 5 L25 10 L31 12 L33 18 L30 24 L25 26 L23 31 L17 33 L11 30 L9 25 L4 23 L3 17 L6 11 L11 9 L13 4 Z M24 18 A6 6 0 1 1 12 18 A6 6 0 1 1 24 18" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1570" y="368.0" fill="#f6f5ff" font-size="28" font-weight="600">机顶盒配置</text><text x="96" y="514" fill="#f6f5ff" font-size="30" font-weight="600">第三方直播源</text><text x="318" y="514" fill="#a9adc6" font-size="24" font-weight="400">0 个来源</text><rect x="96" y="548" width="1728" height="286" rx="18" fill="#141a2d" stroke="#303950" stroke-width="1"/><g transform="translate(929 585) scale(1.7222222222222223)"><path d="M18 3 L33 18 L18 33 L3 18 Z M18 10 L26 18 L18 26 L10 18 Z" fill="none" stroke="#82779c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="960" y="704" text-anchor="middle" fill="#f6f5ff" font-size="32" font-weight="600">暂无第三方直播源</text><text x="960" y="758" text-anchor="middle" fill="#a9adc6" font-size="26">支持 M3U，以及提供直播频道的 Jellyfin 服务器</text><rect x="1230" y="220" width="600" height="206" rx="18" fill="#070b16" stroke="none" stroke-width="1"/><rect x="1224" y="208" width="600" height="206" rx="18" fill="#1b2238" stroke="#606b86" stroke-width="1"/><rect x="1238" y="222" width="572" height="82" rx="12" fill="url(#purple)" stroke="#fff" stroke-width="4"/><g transform="translate(1256 246) scale(0.8888888888888888)"><path d="M15 10 L19 6 A8 8 0 0 1 30 17 L25 22 M11 14 L6 19 A8 8 0 0 0 17 30 L22 25 M12 24 L24 12" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1310" y="256" fill="#f6f5ff" font-size="28" font-weight="600">M3U 直播源</text><text x="1310" y="288" fill="#dbd4ed" font-size="24" font-weight="400">添加播放列表与可选节目单</text><rect x="1238" y="312" width="572" height="82" rx="12" fill="none" stroke="none" stroke-width="1"/><g transform="translate(1256 336) scale(0.8888888888888888)"><path d="M4 7 H32 V27 H4 Z M12 32 H24 M18 27 V32" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1310" y="346" fill="#f6f5ff" font-size="28" font-weight="600">Jellyfin 服务器</text><text x="1310" y="378" fill="#a9adc6" font-size="24" font-weight="400">读取服务端已配置的直播频道</text></g></svg>