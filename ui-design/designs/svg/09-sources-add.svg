9bfd0" font-size="24" font-weight="400">145 个频道 · 今天 20:50 更新</text><rect x="1204" y="364.0" width="244" height="88" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="1326.0" y="420.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">刷新频道</text><rect x="1472" y="364.0" width="300" height="88" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="1622.0" y="420.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">机顶盒配置</text><defs><clipPath id="frost-1188-316-600-216-clip"><rect x="1188" y="316" width="600" height="216" rx="18" fill="#fff" stroke="none" stroke-width="1"/></clipPath><filter id="frost-1188-316-600-216-blur" x="0" y="0" width="1920" height="1080" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="12"/></filter></defs><g data-role="frosted-backdrop" clip-path="url(#frost-1188-316-600-216-clip)"><image x="0" y="0" width="1920" height="1080" href="data:image/svg+xml;base64," filter="url(#frost-1188-316-600-216-blur)"/></g><rect x="1188" y="316" width="600" height="216" rx="16" fill="#1b2238" fill-opacity="0.85" stroke="#59627d" stroke-width="1"/><rect x="1204" y="332" width="568" height="88" rx="14" fill="url(#purple)" stroke="#fff" stroke-width="4"/><text x="1488.0" y="388.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">M3U 直播源</text><rect x="1204" y="428" width="568" height="88" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="1488.0" y="484.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">Jellyfin 服务器</text></g></svg>