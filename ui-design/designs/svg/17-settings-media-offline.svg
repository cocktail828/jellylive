<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">媒体库连接：暂时未连接</title><desc id="desc">保留上次媒体库名，但明确未连接；错误信息与恢复动作可见，不把离线说成没有媒体库。 媒体库名称在前、连接状态在后，同一行展示，必要说明另列。 同行圆形刷新图标为重试连接，白框表示当前焦点；只使用当前保存的连接，保留原媒体库与账号。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="140" fill="#f6f5ff" font-size="46" font-weight="650">设置</text><text x="1824" y="132" fill="#c5b8ff" font-size="30" font-weight="500" text-anchor="end">JellyLive</text><rect x="100" y="226" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="280" fill="#f6f5ff" font-size="30" font-weight="500">播放设置</text><rect x="100" y="338" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="392" fill="#f6f5ff" font-size="30" font-weight="500">显示与操作</text><rect x="100" y="450" width="348" height="84" rx="14" fill="#36305c" stroke="#363e5d" stroke-width="1"/><text x="124" y="504" fill="#c5b8ff" font-size="30" font-weight="650">媒体库连接</text><rect x="100" y="562" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="616" fill="#f6f5ff" font-size="30" font-weight="500">机顶盒配置</text><rect x="100" y="674" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="728" fill="#f6f5ff" font-size="30" font-weight="500">关于</text><text x="544" y="272" fill="#f6f5ff" font-size="36" font-weight="650">媒体库连接</text><text x="548" y="400" fill="#f6f5ff" font-size="36" font-weight="650">客厅媒体库</text><text x="728" y="400" fill="#f2b4bb" font-size="36" font-weight="600"> · 未连接</text><g data-role="connection-retry" data-busy="false" aria-label="重试连接"><rect x="912" y="340" width="96" height="96" rx="48" fill="url(#purple)" stroke="#fff" stroke-width="4"/><g transform="translate(942 370) scale(1.0)"><path d="M30 13 A13 13 0 1 0 30 24 M30 4 V14 H20" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="548" y="482" fill="#b9bfd0" font-size="28" font-weight="400">暂时无法连接，请重试或切换媒体库。</text><g data-role="settings-row" data-title="新增媒体库" data-kind="choice" data-disabled="false"><rect x="548" y="554" width="1240" height="96" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="614.0" fill="#f6f5ff" font-size="32" font-weight="600">新增媒体库</text><text x="1722" y="614.0" fill="#c5b8ff" font-size="28" font-weight="400" text-anchor="end"></text><g transform="translate(1742 587.0) scale(0.8333333333333334)"><path d="M13 5 L26 18 L13 31" fill="none" stroke="#b9bfd0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g data-role="settings-row" data-title="切换媒体库" data-kind="choice" data-disabled="false"><rect x="548" y="666" width="1240" height="96" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="726.0" fill="#f6f5ff" font-size="32" font-weight="600">切换媒体库</text><text x="1722" y="726.0" fill="#c5b8ff" font-size="28" font-weight="400" text-anchor="end"></text><g transform="translate(1742 699.0) scale(0.8333333333333334)"><path d="M13 5 L26 18 L13 31" fill="none" stroke="#b9bfd0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></svg>