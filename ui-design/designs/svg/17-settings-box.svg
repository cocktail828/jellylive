<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">设置：机顶盒配置入口</title><desc id="desc">机顶盒配置先显示已保存状态和四个清晰入口，不自动展示全量参数。仅适配安徽移动百视通；示例不含真实设备账号。 与直播源图87共用导入、手动修改、导出及草稿流程，按实际来源返回。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="140" fill="#f6f5ff" font-size="46" font-weight="650">设置</text><text x="1824" y="132" fill="#c5b8ff" font-size="30" font-weight="500" text-anchor="end">JellyLive</text><rect x="100" y="226" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="280" fill="#f6f5ff" font-size="30" font-weight="500">播放设置</text><rect x="100" y="338" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="392" fill="#f6f5ff" font-size="30" font-weight="500">显示与操作</text><rect x="100" y="450" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="504" fill="#f6f5ff" font-size="30" font-weight="500">媒体库连接</text><rect x="100" y="562" width="348" height="84" rx="14" fill="#36305c" stroke="#363e5d" stroke-width="1"/><text x="124" y="616" fill="#c5b8ff" font-size="30" font-weight="650">机顶盒配置</text><rect x="100" y="674" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="728" fill="#f6f5ff" font-size="30" font-weight="500">关于</text><text x="544" y="272" fill="#f6f5ff" font-size="36" font-weight="650">机顶盒配置</text><text x="548" y="332" fill="#b9bfd0" font-size="28" font-weight="400">已保存配置 · 安徽移动百视通</text><g data-role="settings-row" data-title="从机顶盒导入" data-kind="choice"><rect x="548" y="374" width="1240" height="112" rx="14" fill="url(#purple)" stroke="#fff" stroke-width="4"/><text x="574" y="417" fill="#f6f5ff" font-size="32" font-weight="600">从机顶盒导入</text><text x="574" y="460" fill="#f6f5ff" font-size="24" font-weight="400">读取原机顶盒资料，核对后再保存。</text><text x="1722" y="442.0" fill="#f6f5ff" font-size="28" font-weight="400" text-anchor="end"></text><g transform="translate(1742 415.0) scale(0.8333333333333334)"><path d="M13 5 L26 18 L13 31" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g data-role="settings-row" data-title="导入配置文件" data-kind="choice"><rect x="548" y="506" width="1240" height="112" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="549" fill="#f6f5ff" font-size="32" font-weight="600">导入配置文件</text><text x="574" y="592" fill="#b9bfd0" font-size="24" font-weight="400">选择已有的 JSON 配置文件。</text><text x="1722" y="574.0" fill="#c5b8ff" font-size="28" font-weight="400" text-anchor="end"></text><g transform="translate(1742 547.0) scale(0.8333333333333334)"><path d="M13 5 L26 18 L13 31" fill="none" stroke="#b9bfd0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g data-role="settings-row" data-title="手动修改" data-kind="choice"><rect x="548" y="638" width="1240" height="112" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="681" fill="#f6f5ff" font-size="32" font-weight="600">手动修改</text><text x="574" y="724" fill="#b9bfd0" font-size="24" font-weight="400">修改常用信息，其他参数按类别查看。</text><text x="1722" y="706.0" fill="#c5b8ff" font-size="28" font-weight="400" text-anchor="end"></text><g transform="translate(1742 679.0) scale(0.8333333333333334)"><path d="M13 5 L26 18 L13 31" fill="none" stroke="#b9bfd0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g data-role="settings-row" data-title="导出配置文件" data-kind="choice"><rect x="548" y="770" width="1240" height="112" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="813" fill="#f6f5ff" font-size="32" font-weight="600">导出配置文件</text><text x="574" y="856" fill="#b9bfd0" font-size="24" font-weight="400">文件包含账号与密钥，请妥善保存。</text><text x="1722" y="838.0" fill="#c5b8ff" font-size="28" font-weight="400" text-anchor="end"></text><g transform="translate(1742 811.0) scale(0.8333333333333334)"><path d="M13 5 L26 18 L13 31" fill="none" stroke="#b9bfd0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></svg>