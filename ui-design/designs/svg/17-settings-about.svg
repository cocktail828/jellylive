<title id="title">设置：关于</title><desc id="desc">保留右侧内容区左上关于标题。Logo与JellyLive同行并以整行居中，版本与两行项目/许可证说明围绕同一中线对齐；品牌信息整组上移至页面高度中线附近，不把标题算入居中组。没有整块卡片底色；大字溢出仍可滚动。当前是设计修订，尚未写入APK。</desc>
