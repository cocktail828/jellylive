<title id="title">设置子菜单：侧栏透明度</title><desc id="desc">0–80%、5%步进；左右键、加减点击与拖动均可调整。预览和真实侧栏共用填充与字形描边，移除固定遮罩，背景实际随数值变化；确认或返回恢复原行。</desc>
