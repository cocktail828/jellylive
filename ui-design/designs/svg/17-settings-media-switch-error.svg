<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">切换媒体库：失败保留原会话</title><desc id="desc">失败就地显示原因，保留旧媒体库勾选和目标焦点，允许重试或换目标；不清空当前可用会话。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="140" fill="#f6f5ff" font-size="46" font-weight="650">设置</text><text x="1824" y="132" fill="#c5b8ff" font-size="30" font-weight="500" text-anchor="end">JellyLive</text><rect x="100" y="226" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="280" fill="#f6f5ff" font-size="30" font-weight="500">播放设置</text><rect x="100" y="338" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="392" fill="#f6f5ff" font-size="30" font-weight="500">显示与操作</text><rect x="100" y="450" width="348" height="84" rx="14" fill="#36305c" stroke="#363e5d" stroke-width="1"/><text x="124" y="504" fill="#c5b8ff" font-size="30" font-weight="650">媒体库连接</text><rect x="100" y="562" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="616" fill="#f6f5ff" font-size="30" font-weight="500">机顶盒配置</text><rect x="100" y="674" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="728" fill="#f6f5ff" font-size="30" font-weight="500">关于</text><text x="544" y="272" fill="#f6f5ff" font-size="36" font-weight="650">切换媒体库</text><g data-role="settings-row" data-title="客厅媒体库 · 示例账号" data-kind="radio" data-disabled="false"><rect x="548" y="332" width="1240" height="96" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="392.0" fill="#f6f5ff" font-size="32" font-weight="600">客厅媒体库 · 示例账号</text><g transform="translate(1722 362.0) scale(1.0)"><path d="M5 18 L14 27 L31 8" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g data-role="settings-row" data-title="家庭影音 · 访客账号" data-kind="radio" data-disabled="false"><rect x="548" y="444" width="1240" height="96" rx="14" fill="url(#purple)" stroke="#fff" stroke-width="4"/><text x="574" y="504.0" fill="#f6f5ff" font-size="32" font-weight="600">家庭影音 · 访客账号</text></g><g data-role="settings-row" data-title="书房媒体库 · 示例账号" data-kind="radio" data-disabled="false"><rect x="548" y="556" width="1240" height="96" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="616.0" fill="#f6f5ff" font-size="32" font-weight="600">书房媒体库 · 示例账号</text></g><text x="548" y="758.0" fill="#f2b4bb" font-size="28" font-weight="400">无法连接家庭影音，请检查网络后重试。</text><text x="548" y="801.4" fill="#f2b4bb" font-size="28" font-weight="400">当前仍使用客厅媒体库。</text></g></svg>