<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">媒体库连接：验证中</title><desc id="desc">连接中按钮保留焦点与忙状态，防止重复提交；取消只终止本次操作。实际账号认证成功后才进入媒体库。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="140" fill="#f6f5ff" font-size="46" font-weight="650">连接媒体库</text><text x="1824" y="132" fill="#c5b8ff" font-size="30" font-weight="500" text-anchor="end">JellyLive</text><text x="96" y="202" fill="#b9bfd0" font-size="28" font-weight="400">Jellyfin 或兼容媒体服务器</text><text x="100" y="269" fill="#f6f5ff" font-size="30" font-weight="600">服务器地址</text><rect x="100" y="292" width="1080" height="96" rx="14" fill="#20263e" stroke="#363e5d" stroke-width="1"/><text x="128" y="352" fill="#b9bfd0" font-size="32" font-weight="400">http://media.example:8096</text><text x="100" y="441" fill="#f6f5ff" font-size="30" font-weight="600">用户名</text><rect x="100" y="464" width="1080" height="96" rx="14" fill="#20263e" stroke="#363e5d" stroke-width="1"/><text x="128" y="524" fill="#b9bfd0" font-size="32" font-weight="400">示例账号</text><text x="100" y="613" fill="#f6f5ff" font-size="30" font-weight="600">密码</text><rect x="100" y="636" width="1080" height="96" rx="14" fill="#20263e" stroke="#363e5d" stroke-width="1"/><text x="128" y="696" fill="#b9bfd0" font-size="32" font-weight="400">••••••••</text><text x="100" y="786" fill="#b9bfd0" font-size="28" font-weight="400">正在验证服务器与账号…</text><rect x="100" y="836" width="500" height="88" rx="14" fill="url(#purple)" stroke="#fff" stroke-width="4"/><text x="350.0" y="892.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">正在连接…</text><rect x="628" y="836" width="260" height="88" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="758.0" y="892.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">取消连接</text><rect x="1280" y="292" width="520" height="88" rx="14" fill="#151a2b" stroke="#363e5d" stroke-width="1"/><text x="1540.0" y="348.0" fill="#b9bfd0" font-size="30" font-weight="600" text-anchor="middle">发现局域网服务器</text><text x="1280" y="498" fill="#f6f5ff" font-size="34" font-weight="650">连接提示</text><text x="1280" y="570.0" fill="#b9bfd0" font-size="28" font-weight="400">使用服务器上的媒体账号。</text><text x="1280" y="658.0" fill="#b9bfd0" font-size="28" font-weight="400">切换地址或账号后需重新登录。</text><text x="1280" y="746.0" fill="#b9bfd0" font-size="28" font-weight="400">媒体库与电视直播独立使用。</text></g></svg>