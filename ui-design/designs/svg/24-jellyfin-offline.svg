<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">媒体库：连接失败与恢复</title><desc id="desc">从媒体库入口恢复连接失败时使用。当前媒体库名称、未连接状态、错误说明及两个等宽单行动作整体居中，不加大块卡片背景。默认聚焦重试连接，仅重试当前已保存服务器和账号；切换媒体库打开影视内的已保存列表。没有返回看直播或连接设置按钮，遥控返回回原入口；不得清空原会话。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="107" fill="#f6f5ff" font-size="42" font-weight="650">我的媒体库</text><text x="1628" y="105" fill="#b9b0ef" font-size="32" font-weight="600">JellyLive</text><g data-role="library-connection-error" data-center-x="960"><g transform="translate(928 342) scale(1.7777777777777777)"><path d="M15 10 L19 6 A8 8 0 0 1 30 17 L25 22 M11 14 L6 19 A8 8 0 0 0 17 30 L22 25 M12 24 L24 12" fill="none" stroke="#c5b8ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="960" y="466" text-anchor="middle" fill="#b9bfd0" font-size="30" font-weight="400">客厅媒体库 · 未连接</text><text x="960" y="532" text-anchor="middle" fill="#f6f5ff" font-size="46" font-weight="650">暂时无法连接媒体库</text><text x="960" y="596" text-anchor="middle" fill="#b9bfd0" font-size="28" font-weight="400">请确认媒体库已开启，或切换到其他媒体库。</text><rect x="626" y="650" width="320" height="88" rx="14" fill="url(#purple)" stroke="#ffffff" stroke-width="4"/><text x="786.0" y="704.0" text-anchor="middle" fill="#f6f5ff" font-size="28" font-weight="600">重试连接</text><rect x="974" y="650" width="320" height="88" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="1134.0" y="704.0" text-anchor="middle" fill="#f6f5ff" font-size="28" font-weight="600">切换媒体库</text></g></g></svg>