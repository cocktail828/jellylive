<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">直播源：机顶盒配置</title><desc id="desc">图13内置源“机顶盒配置”打开1120×800电视弹窗，四个大行入口为从机顶盒导入/导入配置文件/手动修改/导出配置文件。先看已配置状态，不把16个字段挤进弹窗；选中入口再进入对应独立步骤。与设置中的配置复用同一草稿及步骤，返回恢复实际入口焦点。 菜单默认每项仅一行，名称在左、值或箭头在右；导出敏感信息提示独立保留。</desc>
