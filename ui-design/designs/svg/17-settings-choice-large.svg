<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">设置子菜单：150%字号</title><desc id="desc">大字选项使用增高行，当前选择勾选独立于白色焦点框；不压缩字号以塞入原行高。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="140" fill="#f6f5ff" font-size="69.0" font-weight="650">设置</text><text x="1824" y="132" fill="#c5b8ff" font-size="45.0" font-weight="500" text-anchor="end">JellyLive</text><rect x="100" y="226" width="348" height="84" rx="14" fill="#36305c" stroke="#363e5d" stroke-width="1"/><text x="124" y="280" fill="#c5b8ff" font-size="45.0" font-weight="650">播放设置</text><rect x="100" y="338" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="392" fill="#f6f5ff" font-size="45.0" font-weight="500">显示与操作</text><rect x="100" y="450" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="504" fill="#f6f5ff" font-size="45.0" font-weight="500">媒体库连接</text><rect x="100" y="562" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="616" fill="#f6f5ff" font-size="45.0" font-weight="500">机顶盒配置</text><rect x="100" y="674" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="728" fill="#f6f5ff" font-size="45.0" font-weight="500">关于</text><text x="544" y="272" fill="#f6f5ff" font-size="54.0" font-weight="650">音轨语言</text><g data-role="settings-row" data-title="跟随媒体" data-kind="radio"><rect x="548" y="332" width="1240" height="156" rx="14" fill="url(#purple)" stroke="#fff" stroke-width="4"/><text x="574" y="385" fill="#f6f5ff" font-size="48.0" font-weight="600">跟随媒体</text><text x="574" y="452" fill="#f6f5ff" font-size="36.0" font-weight="400">使用媒体的默认音轨。</text><g transform="translate(1722 392.0) scale(1.0)"><path d="M5 18 L14 27 L31 8" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g data-role="settings-row" data-title="中文" data-kind="radio"><rect x="548" y="512" width="1240" height="156" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="565" fill="#f6f5ff" font-size="48.0" font-weight="600">中文</text><text x="574" y="632" fill="#b9bfd0" font-size="36.0" font-weight="400">优先选择中文音轨。</text></g><g data-role="settings-row" data-title="英语" data-kind="radio"><rect x="548" y="692" width="1240" height="156" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="745" fill="#f6f5ff" font-size="48.0" font-weight="600">英语</text><text x="574" y="812" fill="#b9bfd0" font-size="36.0" font-weight="400">优先选择英语音轨。</text></g></g></svg>