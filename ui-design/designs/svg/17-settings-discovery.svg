<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">媒体库连接：发现服务器</title><desc id="desc">发现列表每项一行，左侧服务器名称，右侧地址；均为虚构example域示例。名称或地址过长时按可用宽度省略，必要时允许展开详情。空结果可回手动填写，不伪造发现结果。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="140" fill="#f6f5ff" font-size="46" font-weight="650">选择媒体服务器</text><text x="1824" y="132" fill="#c5b8ff" font-size="30" font-weight="500" text-anchor="end">JellyLive</text><text x="100" y="212" fill="#b9bfd0" font-size="28" font-weight="400">发现的局域网服务</text><rect x="100" y="292" width="1688" height="104" rx="14" fill="url(#purple)" stroke="#fff" stroke-width="4"/><text x="132" y="357" fill="#f6f5ff" font-size="34" font-weight="600">客厅媒体库</text><text x="1728" y="357" fill="#f6f5ff" font-size="28" font-weight="400" text-anchor="end">media.example:8096</text><rect x="100" y="420" width="1688" height="104" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="132" y="485" fill="#f6f5ff" font-size="34" font-weight="600">家庭影音服务器</text><text x="1728" y="485" fill="#c5b8ff" font-size="28" font-weight="400" text-anchor="end">cinema.example:8096</text><rect x="100" y="548" width="1688" height="104" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="132" y="613" fill="#f6f5ff" font-size="34" font-weight="600">书房媒体库</text><text x="1728" y="613" fill="#c5b8ff" font-size="28" font-weight="400" text-anchor="end">library.example:8096</text></g></svg>