<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">媒体播放：进入时统一缓冲提示</title><desc id="desc">进入播放后默认黑底等待，连续等待不足800ms不显示提示；达到阈值仅显示居中“正在缓冲…”，包括地址获取与播放器准备阶段，不显示双重提示、虚假时长或进度。成功播放后收起；返回可取消当前请求并恢复详情焦点，迟到响应不能重新打开播放器。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#080c18" stroke="none" stroke-width="1"/><g data-role="playback-wait" data-focusable="false" data-live="polite"><rect x="760" y="476" width="400" height="128" rx="16" fill="#101629" fill-opacity="0.94" stroke="none" stroke-width="1"/><g transform="translate(837.0 516) scale(1.3333333333333333)"><path d="M30 13 A13 13 0 1 0 30 24 M30 4 V14 H20" fill="none" stroke="#c5b4ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="913.0" y="555" fill="#f6f5ff" font-size="34" font-weight="600">正在缓冲…</text></g></g></svg>