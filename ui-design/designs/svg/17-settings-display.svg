<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">设置：显示页签联动</title><desc id="desc">显示与操作仅包含真实可修改的字号、频道侧栏透明度，并提供可读性预览。移除伪设置项；5%电视安全区为固定布局约束。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="140" fill="#f6f5ff" font-size="46" font-weight="650">设置</text><text x="1824" y="132" fill="#c5b8ff" font-size="30" font-weight="500" text-anchor="end">JellyLive</text><rect x="100" y="226" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="280" fill="#f6f5ff" font-size="30" font-weight="500">播放设置</text><rect x="100" y="338" width="348" height="84" rx="14" fill="url(#purple)" stroke="#fff" stroke-width="4"/><text x="124" y="392" fill="#f6f5ff" font-size="30" font-weight="650">显示与操作</text><rect x="100" y="450" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="504" fill="#f6f5ff" font-size="30" font-weight="500">媒体库连接</text><rect x="100" y="562" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="616" fill="#f6f5ff" font-size="30" font-weight="500">机顶盒配置</text><rect x="100" y="674" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="728" fill="#f6f5ff" font-size="30" font-weight="500">关于</text><text x="544" y="272" fill="#f6f5ff" font-size="36" font-weight="650">显示与操作</text><g data-role="settings-row" data-title="字号" data-kind="choice"><rect x="548" y="320" width="1240" height="112" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="363" fill="#f6f5ff" font-size="32" font-weight="600">字号</text><text x="574" y="406" fill="#b9bfd0" font-size="24" font-weight="400">跟随电视系统字号，也可额外加大文字。</text><text x="1722" y="388.0" fill="#c5b8ff" font-size="28" font-weight="400" text-anchor="end">跟随系统</text><g transform="translate(1742 361.0) scale(0.8333333333333334)"><path d="M13 5 L26 18 L13 31" fill="none" stroke="#b9bfd0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g data-role="settings-row" data-title="频道侧栏透明度" data-kind="choice"><rect x="548" y="444" width="1240" height="112" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="487" fill="#f6f5ff" font-size="32" font-weight="600">频道侧栏透明度</text><text x="574" y="530" fill="#b9bfd0" font-size="24" font-weight="400">只调整背景透明度，文字和焦点保持清晰。</text><text x="1722" y="512.0" fill="#c5b8ff" font-size="28" font-weight="400" text-anchor="end">35%</text><g transform="translate(1742 485.0) scale(0.8333333333333334)"><path d="M13 5 L26 18 L13 31" fill="none" stroke="#b9bfd0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="548" y="642" fill="#b9bfd0" font-size="28" font-weight="600">显示预览</text><rect x="548" y="676" width="1240" height="254" rx="14" fill="#101629" stroke="none" stroke-width="1"/><text x="584" y="748" fill="#f6f5ff" font-size="36" font-weight="600">新闻频道</text><text x="584" y="803" fill="#b9bfd0" font-size="28" font-weight="400">节目名称与频道信息</text><text x="584" y="876" fill="#b9bfd0" font-size="24" font-weight="400">示例内容</text></g></svg>