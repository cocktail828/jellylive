ight="96" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="492.0" fill="#f6f5ff" font-size="32" font-weight="600">频道侧栏透明度</text><text x="1722" y="492.0" fill="#c5b8ff" font-size="28" font-weight="400" text-anchor="end">35%</text><g transform="translate(1742 465.0) scale(0.8333333333333334)"><path d="M13 5 L26 18 L13 31" fill="none" stroke="#b9bfd0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="548" y="602" fill="#b9bfd0" font-size="28" font-weight="600">显示预览</text><defs><clipPath id="settings-preview"><rect x="548" y="640" width="1240" height="300" rx="14"/></clipPath></defs><g clip-path="url(#settings-preview)"><svg x="548" y="640" width="1240" height="300" viewBox="0 0 1100 620" preserveAspectRatio="xMidYMid slice">
