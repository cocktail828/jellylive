<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">设置：显示页签联动</title><desc id="desc">字号与频道侧栏透明度均为单行名称和当前值。显示预览加入与播放器一致的背景示例画面及侧栏文字，方便观察字号与背景透明效果。预览不可聚焦，不画虚假操作焦点。</desc>
