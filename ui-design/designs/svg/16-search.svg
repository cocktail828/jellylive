<title id="title">媒体搜索</title><desc id="desc">保留左侧搜索框与6列字母数字键盘、右侧媒体结果。按键沿用图59的深色底、白色焦点和紫色填充；操作区两行：中文 / 英文、空格；删除、清除。删除移除光标前一个字符，清除移除完整查询；空格保留在关键词中。中文 / 英文调用系统输入法选择实际可用的语言，不承诺设备已安装中文输入法。搜索即时刷新，无需完成或搜索按钮；返回恢复查询与列表焦点。</desc>
