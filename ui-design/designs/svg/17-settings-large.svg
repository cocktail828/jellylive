<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">设置：150%字号与滚动</title><desc id="desc">150%系统字号下保持文字尺度，通过滚动显示完整设置项；默认恢复最后行，选中类别不丢失。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="140" fill="#f6f5ff" font-size="69.0" font-weight="650">设置</text><text x="1824" y="132" fill="#c5b8ff" font-size="45.0" font-weight="500" text-anchor="end">JellyLive</text><rect x="100" y="226" width="348" height="84" rx="14" fill="#36305c" stroke="#363e5d" stroke-width="1"/><text x="124" y="280" fill="#c5b8ff" font-size="45.0" font-weight="650">播放设置</text><rect x="100" y="338" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="392" fill="#f6f5ff" font-size="45.0" font-weight="500">显示与操作</text><rect x="100" y="450" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="504" fill="#f6f5ff" font-size="45.0" font-weight="500">媒体库连接</text><rect x="100" y="562" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="616" fill="#f6f5ff" font-size="45.0" font-weight="500">机顶盒配置</text><rect x="100" y="674" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="728" fill="#f6f5ff" font-size="45.0" font-weight="500">关于</text><text x="544" y="272" fill="#f6f5ff" font-size="54.0" font-weight="650">播放设置</text><g data-role="settings-row" data-title="画面比例" data-kind="choice"><rect x="548" y="320" width="1240" height="156" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="373" fill="#f6f5ff" font-size="48.0" font-weight="600">画面比例</text><text x="574" y="440" fill="#b9bfd0" font-size="36.0" font-weight="400">完整显示画面，必要时保留黑边。</text><text x="1722" y="410.0" fill="#c5b8ff" font-size="42.0" font-weight="400" text-anchor="end">原始</text><g transform="translate(1742 383.0) scale(0.8333333333333334)"><path d="M13 5 L26 18 L13 31" fill="none" stroke="#b9bfd0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g data-role="settings-row" data-title="音轨语言" data-kind="choice"><rect x="548" y="488" width="1240" height="156" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="541" fill="#f6f5ff" font-size="48.0" font-weight="600">音轨语言</text><text x="574" y="608" fill="#b9bfd0" font-size="36.0" font-weight="400">优先选择指定语言，实际以媒体提供的音轨为准。</text><text x="1722" y="578.0" fill="#c5b8ff" font-size="42.0" font-weight="400" text-anchor="end">跟随媒体</text><g transform="translate(1742 551.0) scale(0.8333333333333334)"><path d="M13 5 L26 18 L13 31" fill="none" stroke="#b9bfd0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g data-role="settings-row" data-title="字幕语言" data-kind="choice"><rect x="548" y="656" width="1240" height="156" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="709" fill="#f6f5ff" font-size="48.0" font-weight="600">字幕语言</text><text x="574" y="776" fill="#b9bfd0" font-size="36.0" font-weight="400">选择默认字幕语言，播放时仍可临时切换。</text><text x="1722" y="746.0" fill="#c5b8ff" font-size="42.0" font-weight="400" text-anchor="end">关闭</text><g transform="translate(1742 719.0) scale(0.8333333333333334)"><path d="M13 5 L26 18 L13 31" fill="none" stroke="#b9bfd0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g data-role="settings-row" data-title="剧集自动播放下集" data-kind="toggle"><rect x="548" y="824" width="1240" height="156" rx="14" fill="url(#purple)" stroke="#fff" stroke-width="4"/><text x="574" y="877" fill="#f6f5ff" font-size="48.0" font-weight="600">剧集自动播放下集</text><text x="574" y="944" fill="#f6f5ff" font-size="36.0" font-weight="400">自然播完后倒计时5秒，可取消自动播放。</text><text x="1650" y="914.0" fill="#f6f5ff" font-size="42.0" font-weight="400" text-anchor="end">开启</text><rect x="1684" y="881.0" width="80" height="42" rx="21" fill="#7561ed" stroke="none" stroke-width="1"/><circle cx="1742" cy="902.0" r="15" fill="#f6f5ff"/></g><rect x="1810" y="320" width="5" height="650" rx="2" fill="#30364e" stroke="none" stroke-width="1"/><rect x="1810" y="456" width="5" height="514" rx="2" fill="#b9bfd0" stroke="none" stroke-width="1"/></g></svg>