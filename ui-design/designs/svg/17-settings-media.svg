<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">设置：媒体库连接状态</title><desc id="desc">已连接时优先显示连接状态和当前服务器；连接/更换与打开媒体库动作分开。不添加当前没有的退出登录能力。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="140" fill="#f6f5ff" font-size="46" font-weight="650">设置</text><text x="1824" y="132" fill="#c5b8ff" font-size="30" font-weight="500" text-anchor="end">JellyLive</text><rect x="100" y="226" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="280" fill="#f6f5ff" font-size="30" font-weight="500">播放设置</text><rect x="100" y="338" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="392" fill="#f6f5ff" font-size="30" font-weight="500">显示与操作</text><rect x="100" y="450" width="348" height="84" rx="14" fill="#36305c" stroke="#363e5d" stroke-width="1"/><text x="124" y="504" fill="#c5b8ff" font-size="30" font-weight="650">媒体库连接</text><rect x="100" y="562" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="616" fill="#f6f5ff" font-size="30" font-weight="500">机顶盒配置</text><rect x="100" y="674" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="728" fill="#f6f5ff" font-size="30" font-weight="500">关于</text><text x="544" y="272" fill="#f6f5ff" font-size="36" font-weight="650">媒体库连接</text><text x="548" y="355" fill="#b9bfd0" font-size="28" font-weight="400">当前媒体库</text><text x="548" y="427" fill="#f6f5ff" font-size="44" font-weight="650">客厅媒体库</text><text x="548" y="485" fill="#bfe2d2" font-size="30" font-weight="400">已连接</text><text x="548" y="564.0" fill="#b9bfd0" font-size="26" font-weight="400">播放和浏览使用当前账号的访问权限。</text><g data-role="settings-row" data-title="连接或更换媒体库" data-kind="choice"><rect x="548" y="650" width="1240" height="112" rx="14" fill="url(#purple)" stroke="#fff" stroke-width="4"/><text x="574" y="693" fill="#f6f5ff" font-size="32" font-weight="600">连接或更换媒体库</text><text x="574" y="736" fill="#f6f5ff" font-size="24" font-weight="400">选择服务器并登录后切换连接。</text><text x="1722" y="718.0" fill="#f6f5ff" font-size="28" font-weight="400" text-anchor="end"></text><g transform="translate(1742 691.0) scale(0.8333333333333334)"><path d="M13 5 L26 18 L13 31" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g data-role="settings-row" data-title="打开媒体库" data-kind="choice"><rect x="548" y="774" width="1240" height="112" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="817" fill="#f6f5ff" font-size="32" font-weight="600">打开媒体库</text><text x="574" y="860" fill="#b9bfd0" font-size="24" font-weight="400">返回当前媒体库首页。</text><text x="1722" y="842.0" fill="#c5b8ff" font-size="28" font-weight="400" text-anchor="end"></text><g transform="translate(1742 815.0) scale(0.8333333333333334)"><path d="M13 5 L26 18 L13 31" fill="none" stroke="#b9bfd0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></svg>