<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">设置：添加或编辑直播源</title><desc id="desc">沿用设置两栏布局，左侧直播源选中；右侧显示名称、M3U地址、可选XMLTV和检测/保存/取消。不新增独立管理入口，检测失败保留输入，删除需确认，未保存不改变原来源。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="140" fill="#f6f5ff" font-size="46" font-weight="650">设置</text><text x="1824" y="132" fill="#c5b8ff" font-size="30" font-weight="500" text-anchor="end">JellyLive</text><rect x="100" y="226" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="280" fill="#f6f5ff" font-size="30" font-weight="500">播放设置</text><rect x="100" y="338" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="392" fill="#f6f5ff" font-size="30" font-weight="500">显示与操作</text><rect x="100" y="450" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="504" fill="#f6f5ff" font-size="30" font-weight="500">媒体库连接</text><rect x="100" y="562" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="616" fill="#f6f5ff" font-size="30" font-weight="500">机顶盒配置</text><rect x="100" y="674" width="348" height="84" rx="14" fill="#36305c" stroke="#363e5d" stroke-width="1"/><text x="124" y="728" fill="#c5b8ff" font-size="30" font-weight="650">直播源</text><rect x="100" y="786" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="840" fill="#f6f5ff" font-size="30" font-weight="500">关于</text><text x="544" y="272" fill="#f6f5ff" font-size="36" font-weight="650">添加直播源</text><text x="548" y="340" fill="#b9bfd0" font-size="28" font-weight="400">来源名称</text><rect x="548" y="364" width="1240" height="80" rx="14" fill="#20263e" stroke="#3a425f" stroke-width="1"/><text x="576" y="416" fill="#f6f5ff" font-size="30" font-weight="400">家庭 IPTV</text><text x="548" y="498" fill="#b9bfd0" font-size="28" font-weight="400">M3U 播放列表地址</text><rect x="548" y="522" width="1240" height="80" rx="14" fill="#20263e" stroke="#fff" stroke-width="4"/><text x="576" y="574" fill="#f6f5ff" font-size="30" font-weight="400">https://example.com/live/channels.m3u</text><text x="548" y="656" fill="#b9bfd0" font-size="28" font-weight="400">XMLTV 节目单地址（可选）</text><rect x="548" y="680" width="1240" height="80" rx="14" fill="#20263e" stroke="#3a425f" stroke-width="1"/><text x="576" y="732" fill="#f6f5ff" font-size="30" font-weight="400">https://example.com/live/guide.xml</text><text x="548" y="816" fill="#b9bfd0" font-size="26" font-weight="400">待检测</text><rect x="548" y="852" width="296" height="88" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="696.0" y="908.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">检测来源</text><rect x="868" y="852" width="296" height="88" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="1016.0" y="908.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">保存来源</text><rect x="1188" y="852" width="220" height="88" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="1298.0" y="908.0" fill="#f6f5ff" font-size="30" font-weight="600" text-anchor="middle">取消</text></g></svg>