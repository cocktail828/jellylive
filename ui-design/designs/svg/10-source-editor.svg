<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">添加或编辑第三方源</title><desc id="desc">网址为示例；检测失败显示行内错误并保留输入。保存后加入来源列表和对应分组，不自动切台或改当前播放。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="107" fill="#f6f5ff" font-size="42" font-weight="650">添加第三方直播源</text><text x="1628" y="105" fill="#b9b0ef" font-size="32" font-weight="600">JellyLive</text><text x="96" y="155" fill="#a9adc6" font-size="24" font-weight="400">输入来源信息，检测成功后保存到频道列表</text><text x="128" y="226" fill="#a9adc6" font-size="28" font-weight="400">来源名称</text><rect x="128" y="250" width="1376" height="80" rx="14" fill="#1c223c" stroke="#3a425f" stroke-width="1"/><text x="158" y="302" fill="#f6f5ff" font-size="30" font-weight="400">家庭 IPTV</text><text x="128" y="390" fill="#a9adc6" font-size="28" font-weight="400">M3U 播放列表地址</text><rect x="128" y="414" width="1376" height="80" rx="14" fill="#1c223c" stroke="#fff" stroke-width="4"/><text x="158" y="466" fill="#f6f5ff" font-size="30" font-weight="400">https://example.com/live/channels.m3u</text><text x="128" y="554" fill="#a9adc6" font-size="28" font-weight="400">XMLTV 节目单地址（可选）</text><rect x="128" y="578" width="1376" height="80" rx="14" fill="#1c223c" stroke="#3a425f" stroke-width="1"/><text x="158" y="630" fill="#f6f5ff" font-size="30" font-weight="400">https://example.com/live/guide.xml</text><text x="128" y="737" fill="#a9adc6" font-size="26" font-weight="400">检测状态：待检测。未填写节目单也可正常观看。</text><rect x="128" y="800" width="250" height="76" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="154" y="848.0" fill="#f6f5ff" font-size="28" font-weight="600">检测来源</text><rect x="408" y="800" width="250" height="76" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="434" y="848.0" fill="#f6f5ff" font-size="28" font-weight="600">保存来源</text><rect x="688" y="800" width="180" height="76" rx="14" fill="#242a46" stroke="#363e5d" stroke-width="1"/><text x="714" y="848.0" fill="#f6f5ff" font-size="28" font-weight="600">取消</text></g></svg>