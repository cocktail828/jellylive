<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">设置子菜单：画面比例</title><desc id="desc">原始/填充/拉伸用明确效果说明；选项内容就近在右侧内容区展示，左类别保留选中态。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#080c18"/></linearGradient>
<linearGradient id="purple" x2="1" y2="1"><stop stop-color="#6652d5"/><stop offset="1" stop-color="#3a327d"/></linearGradient></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="1920" height="1080" fill="url(#bg)"/><text x="96" y="140" fill="#f6f5ff" font-size="46" font-weight="650">设置</text><text x="1824" y="132" fill="#c5b8ff" font-size="30" font-weight="500" text-anchor="end">JellyLive</text><rect x="100" y="226" width="348" height="84" rx="14" fill="#36305c" stroke="#363e5d" stroke-width="1"/><text x="124" y="280" fill="#c5b8ff" font-size="30" font-weight="650">播放设置</text><rect x="100" y="338" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="392" fill="#f6f5ff" font-size="30" font-weight="500">显示与操作</text><rect x="100" y="450" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="504" fill="#f6f5ff" font-size="30" font-weight="500">媒体库连接</text><rect x="100" y="562" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="616" fill="#f6f5ff" font-size="30" font-weight="500">机顶盒配置</text><rect x="100" y="674" width="348" height="84" rx="14" fill="#171c32" stroke="#363e5d" stroke-width="1"/><text x="124" y="728" fill="#f6f5ff" font-size="30" font-weight="500">关于</text><text x="544" y="272" fill="#f6f5ff" font-size="36" font-weight="650">画面比例</text><g data-role="settings-row" data-title="原始" data-kind="radio"><rect x="548" y="332" width="1240" height="112" rx="14" fill="url(#purple)" stroke="#fff" stroke-width="4"/><text x="574" y="375" fill="#f6f5ff" font-size="32" font-weight="600">原始</text><text x="574" y="418" fill="#f6f5ff" font-size="24" font-weight="400">完整显示画面，必要时保留黑边。</text><g transform="translate(1722 370.0) scale(1.0)"><path d="M5 18 L14 27 L31 8" fill="none" stroke="#f6f5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g data-role="settings-row" data-title="填充" data-kind="radio"><rect x="548" y="464" width="1240" height="112" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="507" fill="#f6f5ff" font-size="32" font-weight="600">填充</text><text x="574" y="550" fill="#b9bfd0" font-size="24" font-weight="400">保持比例裁剪，铺满屏幕。</text></g><g data-role="settings-row" data-title="拉伸" data-kind="radio"><rect x="548" y="596" width="1240" height="112" rx="14" fill="#1b2038" stroke="none" stroke-width="0"/><text x="574" y="639" fill="#f6f5ff" font-size="32" font-weight="600">拉伸</text><text x="574" y="682" fill="#b9bfd0" font-size="24" font-weight="400">铺满屏幕，画面比例可能变化。</text></g></g></svg>